<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bgReg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2458"/>
      <stop offset="60%" stop-color="#14439B"/>
      <stop offset="100%" stop-color="#0D2F73"/>
    </linearGradient>
    <linearGradient id="goldOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bgReg)"/>
  <circle cx="700" cy="90" r="160" fill="#1E5CD1" opacity="0.3"/>
  <circle cx="110" cy="420" r="140" fill="#F97316" opacity="0.16"/>
  <!-- Main Certificate Card -->
  <rect x="135" y="75" width="380" height="330" rx="22" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="4"/>
  <rect x="135" y="75" width="380" height="62" rx="22" fill="#EFF6FF"/>
  <rect x="135" y="115" width="380" height="22" fill="#EFF6FF"/>
  <rect x="165" y="96" width="150" height="18" rx="9" fill="#0A2458"/>
  <rect x="330" y="96" width="70" height="18" rx="9" fill="#F97316"/>
  <!-- Lines -->
  <rect x="165" y="162" width="210" height="14" rx="7" fill="#1E3A8A" opacity="0.85"/>
  <rect x="165" y="192" width="280" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="165" y="214" width="250" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="165" y="236" width="265" height="10" rx="5" fill="#CBD5E1"/>
  <!-- Verified Badges -->
  <rect x="165" y="274" width="132" height="44" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  <text x="231" y="302" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="16" font-weight="bold">GSTIN VERIFIED</text>
  <rect x="310" y="274" width="132" height="44" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="376" y="302" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif" font-size="16" font-weight="bold">MSME / ISO</text>
  <!-- Stamp Seal -->
  <circle cx="445" cy="340" r="46" fill="url(#goldOrange)"/>
  <circle cx="445" cy="340" r="35" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M430 340 L441 351 L463 328" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floating Right Badges -->
  <rect x="545" y="120" width="195" height="72" rx="16" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="582" cy="156" r="18" fill="#0A2458"/>
  <path d="M574 156 L580 162 L592 149" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="612" y="152" fill="#0A2458" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Factory License</text>
  <text x="612" y="172" fill="#64748B" font-family="Arial, sans-serif" font-size="12">PCB &amp; Statutory NOC</text>

  <rect x="545" y="214" width="195" height="72" rx="16" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="582" cy="250" r="18" fill="#F97316"/>
  <path d="M574 250 L580 256 L592 243" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="612" y="246" fill="#0A2458" font-family="Arial, sans-serif" font-size="15" font-weight="bold">GST &amp; IEC Desk</text>
  <text x="612" y="266" fill="#64748B" font-family="Arial, sans-serif" font-size="12">Fast Pan-India Filing</text>

  <rect x="545" y="308" width="195" height="72" rx="16" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="582" cy="344" r="18" fill="#10B981"/>
  <path d="M574 344 L580 350 L592 337" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="612" y="340" fill="#0A2458" font-family="Arial, sans-serif" font-size="15" font-weight="bold">ISO 9001 / 45001</text>
  <text x="612" y="360" fill="#64748B" font-family="Arial, sans-serif" font-size="12">Certified Compliance</text>
